<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      
      <!-- Giriş Kartı -->
      <div class="card shadow-lg border-0 rounded-4 mt-5">
        
        <!-- Kart Başlığı (Angular Gradient) -->
        <div class="card-header text-white text-center py-4 gradient-header rounded-top-4">
          <h3 class="fw-bold my-2">TaskFlow Giriş</h3>
          <p class="small mb-0 text-white-50">Sisteme erişmek için kimliğinizi doğrulayın.</p>
        </div>
        
        <div class="card-body p-5">
         <form>
  <!-- E-Posta -->
  <div class="mb-3">
    <label class="form-label fw-bold text-muted small">E-Posta Adresi</label>
    <div class="input-group">
      <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
      <input type="email" class="form-control bg-light border-0 shadow-none py-2" 
              
             [(ngModel)]="girilenEmail" name="email">
    </div>
  </div>

  <!-- Şifre -->
  <div class="mb-4">
    <label class="form-label fw-bold text-muted small">Şifre</label>
    <div class="input-group">
      <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
      <input type="password" class="form-control bg-light border-0 shadow-none py-2" 
              
             [(ngModel)]="girilenSifre" name="sifre">
    </div>
  </div>

  <!-- Buton -->
  <button type="button" class="btn w-100 text-white fw-bold py-2 rounded-pill shadow-sm mb-3" 
          style="background: linear-gradient(135deg, #dd0031 0%, #830051 100%); border: none;" 
          (click)="sistemeGirisYap()">
    GİRİŞ YAP <i class="bi bi-box-arrow-in-right ms-1"></i>
  </button>
</form>
        </div>
        
        <!-- Kayıt Ol Yönlendirmesi -->
        <div class="card-footer text-center py-3 bg-white rounded-bottom-4 border-top-0">
          <div class="small">
            <a href="/register" class="register-link fw-semibold">Hesabın yok mu? Hemen Kayıt Ol!</a>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>
