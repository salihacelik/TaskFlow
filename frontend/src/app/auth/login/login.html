<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      
      <!-- Giriş Kartı -->
      <div class="card shadow-lg border-0 rounded-4 mt-5">
        
        <!-- Kart Başlığı (Angular Gradient) -->
        <div class="card-header text-white text-center py-4 gradient-header rounded-top-4">
          <h3 class="fw-bold my-2">TaskFlow Giriş</h3>
          <p class="small mb-0 text-white-50">Sisteme erişmek için kimliğinizi doğrulayın.</p>
        </div>
        
        <div class="card-body p-5">
          <form>
            
            <!-- E-posta Kutusu (Input artık üstte!) -->
            <div class="form-floating mb-4 custom-input">
              <input class="form-control" id="inputEmail" type="email" placeholder="ornek@taskflow.com" />
              <label for="inputEmail">E-posta Adresi</label>
            </div>
            
            <!-- Şifre Kutusu (Input artık üstte!) -->
            <div class="form-floating mb-4 custom-input">
              <input class="form-control" id="inputPassword" type="password" placeholder="Şifre" />
              <label for="inputPassword">Şifre</label>
            </div>

            <!-- Yaratıcı Giriş Butonu -->
            <div class="d-grid mt-4 mb-0">
              <button class="btn gradient-btn py-3 fw-bold rounded-pill shadow-sm" type="button">GİRİŞ YAP</button>
            </div>
            
          </form>
        </div>
        
        <!-- Kayıt Ol Yönlendirmesi -->
        <div class="card-footer text-center py-3 bg-white rounded-bottom-4 border-top-0">
          <div class="small">
            <a href="/register" class="register-link fw-semibold">Hesabın yok mu? Hemen Kayıt Ol!</a>
          </div>
        </div>
        
      </div>
    </div>
  </div>
</div>
